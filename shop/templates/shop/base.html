<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}STEM Books Store{% endblock %}</title>
  <script>
    // Dark/light mode: the saved choice wins, otherwise follow the device setting
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .book-cover { height: 300px; width: 100%; object-fit: contain; background: var(--bs-secondary-bg); }
    .placeholder-cover {
      background: linear-gradient(135deg, #1f3a5f, #4a7fb5);
      color: #fff; font-weight: 600; font-size: 1.05rem;
    }
    .star-rating { display: inline-flex; flex-direction: row-reverse; gap: .15rem; }
    .star-rating input { display: none; }
    .star-rating label { font-size: 2rem; color: #adb5bd; cursor: pointer; }
    .star-rating input:checked ~ label,
    .star-rating label:hover,
    .star-rating label:hover ~ label { color: #ffc107; }
  </style>
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">STEM Books</a>
      <form class="d-flex flex-grow-1 mx-lg-4 my-2 my-lg-0" method="get" action="{% url 'home' %}">
        <input class="form-control me-2" type="search" name="q" value="{{ filters.q }}" placeholder="Search by title">
        <button class="btn btn-outline-light" type="submit">Search</button>
      </form>
      <button id="themeToggle" class="btn btn-outline-light ms-lg-2 me-lg-1 my-2 my-lg-0" type="button" title="Switch dark / light mode">🌙</button>
      <a class="btn btn-warning" href="{% url 'cart' %}">
        🛒 Cart <span class="badge text-bg-dark">{{ cart_count }}</span>
      </a>
    </div>
  </nav>

  <main class="container py-4">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var toggle = document.getElementById("themeToggle");
    function showIcon() {
      var dark = document.documentElement.getAttribute("data-bs-theme") === "dark";
      toggle.textContent = dark ? "☀️" : "🌙";
    }
    toggle.addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-bs-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      showIcon();
    });
    showIcon();
  </script>
</body>
</html>
